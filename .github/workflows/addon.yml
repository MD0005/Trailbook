# Tests every push; builds the add-on images when trailbook/config.yaml has a version
# that is not on GHCR yet. HA then offers the update.
name: Add-on

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "backend[dev]"
      - run: ruff check backend && ruff format --check backend
      - run: python -m pytest
        working-directory: backend

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version: *"\(.*\)"/\1/p' trailbook/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "ghcr.io/md0005/trailbook-aarch64:$version" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Version $version is already published; bump trailbook/config.yaml to ship."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [test, version]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: base
        run: |
          echo "from=$(sed -n 's/^ *${{ matrix.arch }}: *//p' trailbook/build.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: trailbook/Dockerfile
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/md0005/trailbook-${{ matrix.arch }}:${{ needs.version.outputs.version }}
            ghcr.io/md0005/trailbook-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # One name for both architectures, for plain Docker (docker-compose.yml). Home Assistant keeps
  # pulling trailbook-{arch}; this only points at the images pushed above.
  manifest:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/md0005/trailbook:$VERSION" -t ghcr.io/md0005/trailbook:latest \
            "ghcr.io/md0005/trailbook-aarch64:$VERSION" "ghcr.io/md0005/trailbook-amd64:$VERSION"

  # The Windows app: Trailbook.exe and its installer, attached to a GitHub release of the
  # version with its changelog section. The app offers that release as an update. Only the
  # newest release is kept.
  windows:
    needs: [test, version]
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "backend[desktop]"
      - name: Inno Setup
        shell: bash
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
      - run: python windows/build.py
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # the changelog section of this version, without its "## <version>" line
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' trailbook/CHANGELOG.md > notes.md
          installer="windows/out/Trailbook-Setup-$VERSION.exe"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$installer" --clobber
          else
            gh release create "v$VERSION" "$installer" --title "Trailbook $VERSION" \
              --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
          # only the newest release is kept: the older ones (and their tags) are deleted
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" != "v$VERSION" ]; then gh release delete "$tag" --cleanup-tag --yes; fi
          done

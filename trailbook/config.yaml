# Bump `version` to ship a change to Home Assistant: CI builds the images for a new version,
# then HA shows the update (Settings › Add-ons › Trailbook).
name: Trailbook
version: "0.1.1"
slug: trailbook
description: Garmin training log at home — route map, statistics and charts
url: https://github.com/MD0005/Trailbook
image: ghcr.io/md0005/trailbook-{arch}
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-path
panel_title: Trailbook
backup: hot
# Notifications in Home Assistant (e.g. a Garmin key that stopped working).
homeassistant_api: true
map:
  - type: share
    read_only: false
  - type: media
    read_only: true
  - type: addon_config
    read_only: false
options: {}
schema: {}

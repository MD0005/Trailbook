[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trailbook"
version = "0.1.0"
description = "Self-hosted training log: FIT import, route map, statistics and charts"
license = { text = "MIT" }
requires-python = ">=3.11"
# All pure Python: install on aarch64 without compiling anything.
dependencies = [
    "garmin-fit-sdk>=21.0",
    "starlette>=0.40",
    "uvicorn>=0.30",  # plain uvicorn (h11), no compiled extras
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx2"]

[project.scripts]
trailbook = "trailbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trailbook = ["static/*", "static/vendor/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

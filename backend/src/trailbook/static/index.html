<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailbook</title>
<script>
  // Apply the saved theme before first paint (dark is the default).
  try {
    const t = localStorage.getItem("trailbook-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) { /* storage unavailable: keep dark */ }
</script>
<link rel="stylesheet" href="preview.css">
</head>
<body>
<header>
  <a class="brand" href="#/activities">Trailbook</a>
  <nav id="nav"></nav>
  <div id="tools" class="tools"></div>
</header>
<main id="view"></main>
<script src="preview.js"></script>
</body>
</html>

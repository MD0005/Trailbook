<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailbook</title>
<script>
  // Apply the saved theme before first paint (light is the default).
  try {
    const t = localStorage.getItem("trailbook-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    // Accent colour (same table as ACCENTS in preview.js), applied before first paint.
    const A = { sky: ["#0284c7", "#38bdf8"], teal: ["#0f766e", "#3fb5a0"], indigo: ["#4f46e5", "#8b93ff"],
                violet: ["#7c3aed", "#a78bfa"], rose: ["#e11d48", "#fb7185"], amber: ["#b45309", "#fbbf24"],
                green: ["#15803d", "#4ade80"], graphite: ["#334155", "#cbd5e1"] };
    const a = A[localStorage.getItem("trailbook-accent")] || A.sky;
    const dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.style.setProperty("--accent", dark ? a[1] : a[0]);
    document.documentElement.style.setProperty("--state", dark ? a[1] : a[0]);
  } catch (e) { /* storage unavailable: keep defaults */ }
</script>
<link rel="stylesheet" href="icons/trailbook-icons.css">
<link rel="stylesheet" href="preview.css">
</head>
<body>
<header>
  <a class="brand" href="#/activities"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="currentColor"/><path d="M6 17.5c2.2-.2 2.8-2.4 4.6-3.4 2.1-1.2 4.4.2 6-2.2 1-1.5.6-3.4 1.4-4.9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="17.5" r="1.8" fill="#fff"/><circle cx="18" cy="7" r="1.8" fill="none" stroke="#fff" stroke-width="1.6"/></svg>Trailbook</a>
  <nav id="nav"></nav>
  <div id="tools" class="tools"></div>
</header>
<main id="view"></main>
<script src="icons/trailbook-icons.js"></script>
<script src="preview.js"></script>
<script src="training.js"></script>
<script src="backup.js"></script>
<script src="segments.js"></script>
</body>
</html>
